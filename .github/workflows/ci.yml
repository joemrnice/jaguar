name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Jaguar
        run: make

      - name: Run C Test Suite
        run: make test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build VS Code Extension
        run: |
          cd jaguar-lang-extension
          npm install
          npm run compile
