<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Jaguar head icon - stylized geometric design -->
  <defs>
    <linearGradient id="jaguarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D9450A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main jaguar head silhouette -->
  <path d="M64 8 L88 24 L96 48 L88 72 L72 96 L56 96 L40 72 L32 48 L40 24 Z" 
        fill="url(#jaguarGradient)" 
        stroke="#8B2500" 
        stroke-width="3"/>
  
  <!-- Ear details -->
  <path d="M40 24 L32 12 L48 20 Z" fill="#FF8C5A"/>
  <path d="M88 24 L96 12 L80 20 Z" fill="#FF8C5A"/>
  
  <!-- Eye spots (jaguar characteristic) -->
  <circle cx="52" cy="44" r="6" fill="#2D1B0E"/>
  <circle cx="76" cy="44" r="6" fill="#2D1B0E"/>
  
  <!-- Nose -->
  <ellipse cx="64" cy="60" rx="8" ry="6" fill="#1A0F0A"/>
  
  <!-- Mouth line -->
  <path d="M64 66 L64 78" stroke="#1A0F0A" stroke-width="2"/>
  
  <!-- Whisker dots -->
  <circle cx="48" cy="58" r="2" fill="#8B2500"/>
  <circle cx="80" cy="58" r="2" fill="#8B2500"/>
  <circle cx="46" cy="64" r="2" fill="#8B2500"/>
  <circle cx="82" cy="64" r="2" fill="#8B2500"/>
  
  <!-- Forehead spot pattern (jaguar rosette hint) -->
  <path d="M64 28 L68 36 L64 40 L60 36 Z" fill="#8B2500" opacity="0.6"/>
</svg>
